{% load static %}
<aside class="jarvis-sidebar">

  <!-- Brand Header -->
  <a href="{% url 'dashboard' %}" class="jarvis-sidebar-brand">
    <div class="jarvis-brand-icon-box">
      <!-- Crossed wrenches/tools icon in mint green -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
        <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
      </svg>
    </div>
    <div class="jarvis-brand-text">
      <span class="jarvis-brand-title">MotorAssistant</span>
      <span class="jarvis-brand-subtitle">YOUR REPAIR COPILOT</span>
    </div>
  </a>

  <!-- New Diagnosis CTA -->
  <div class="jarvis-sidebar-action-box">
    <button type="button" class="jarvis-new-diagnosis-btn" id="sidebar-btn-new-diagnosis" title="Start new diagnosis">
      <span>New diagnosis</span>
      <i class="fa-solid fa-arrow-right"></i>
    </button>
  </div>

  <!-- Navigation Links -->
  <ul class="jarvis-sidebar-nav">
    <li class="jarvis-nav-item">
      <a href="{% url 'dashboard' %}" class="jarvis-nav-link {% if request.resolver_match.url_name == 'dashboard' or request.resolver_match.url_name == 'home' %}active{% endif %}">
        <div class="jarvis-nav-link-left">
          <span class="jarvis-nav-link-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="15" height="15">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
            </svg>
          </span>
          <span>Diagnostic chat</span>
        </div>
      </a>
    </li>

    <li class="jarvis-nav-item">
      <a href="{% url 'motor:viewer' %}" class="jarvis-nav-link {% if request.resolver_match.app_name == 'motor' and request.resolver_match.url_name == 'viewer' %}active{% endif %}">
        <div class="jarvis-nav-link-left">
          <span class="jarvis-nav-link-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="15" height="15">
              <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
              <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
            </svg>
          </span>
          <span>Repair guides</span>
        </div>
      </a>
    </li>

    <li class="jarvis-nav-item">
      <a href="#" class="jarvis-nav-link" id="sidebar-history-link">
        <div class="jarvis-nav-link-left">
          <span class="jarvis-nav-link-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="15" height="15">
              <circle cx="12" cy="12" r="10"/>
              <polyline points="12 6 12 12 16 14"/>
            </svg>
          </span>
          <span>Session history</span>
        </div>
      </a>
    </li>
  </ul>

  <!-- Recent Sessions Section -->
  <div class="jarvis-sidebar-section jarvis-recent-sessions-header">
    <span>RECENT SESSIONS</span>
  </div>

  <div class="jarvis-recent-sessions-list" id="sidebar-recent-sessions-list">
    <!-- Populated dynamically by JavaScript from localStorage -->
    <div class="jarvis-sidebar-empty-hint" id="sidebar-recent-empty" style="display:none;">
      No sessions yet.
    </div>
  </div>

  <div class="jarvis-sidebar-spacer"></div>

  <!-- Diagnostic Quota Card (Hidden or minimal) -->
  <div class="jarvis-sidebar-quota-card d-none" id="sidebar-quota-widget">
    <div class="jarvis-sidebar-quota-header">
      <span class="jarvis-sidebar-quota-title">Diagnostic quota</span>
      <span class="jarvis-sidebar-quota-pct" id="sidebar-quota-pct">100%</span>
    </div>
    <div class="jarvis-sidebar-quota-bar">
      <div class="jarvis-sidebar-quota-fill" id="sidebar-quota-bar-fill" style="width: 100%;"></div>
    </div>
    <div class="jarvis-sidebar-quota-sub" id="sidebar-quota-rem">1,500 requests remaining</div>
  </div>

  <!-- Need a mechanic? Box from reference image -->
  <div class="ma-sidebar-mechanic-box">
    <div class="ma-sidebar-mechanic-title">Need a mechanic?</div>
    <div class="ma-sidebar-mechanic-hint">Know when to stop DIY.</div>
  </div>

  <!-- Account settings / Help / Logout -->
  <div class="ma-sidebar-footer-links">
    <a href="#" data-bs-toggle="offcanvas" data-bs-target="#offcanvasSettings">Account settings</a>
    <span class="ma-footer-divider">/</span>
    <a href="#" id="sidebar-help-link">Help</a>
    <span class="ma-footer-divider">/</span>
    <a href="{% url 'logout' %}" title="Sign out">Log out</a>
  </div>

</aside>

<script>
/* Wire sidebar navigation, new diagnosis, recent sessions, history and help links */
(function() {

  // ── New Diagnosis Button ──────────────────────────────────────────────────
  var newDiagBtn = document.getElementById('sidebar-btn-new-diagnosis');
  if (newDiagBtn) {
    newDiagBtn.addEventListener('click', function(e) {
      e.preventDefault();
      var clearBtn = document.getElementById('btn-clear-logs');
      if (clearBtn) {
        clearBtn.click();
      } else {
        window.location.href = "{% url 'dashboard' %}";
      }
    });
  }

  // ── Populate Recent Sessions from localStorage ───────────────────────────
  function getUserKey() {
    // Match the key used in home.html: 'jarvis_ui_history_' + USER_KEY
    var userPk = '{{ request.user.pk|default:"default" }}';
    return userPk;
  }

  function truncate(str, n) {
    if (!str) return '';
    return str.length > n ? str.slice(0, n) + '…' : str;
  }

  function escSidebar(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function populateSidebarSessions(historyArr) {
    var list = document.getElementById('sidebar-recent-sessions-list');
    var emptyHint = document.getElementById('sidebar-recent-empty');
    if (!list) return;

    // Remove all existing session items
    list.querySelectorAll('.jarvis-recent-session-item').forEach(function(el){ el.remove(); });

    // Filter: only user messages (non-bot), not the default init message
    var userMsgs = (historyArr || []).filter(function(item) {
      return item.role !== 'bot' && item.id !== 'init-1' && item.id !== 'cleared-1' && (item.text || '').trim().length > 2;
    });

    // De-duplicate by text, keeping last occurrence, max 5 items
    var seen = {};
    var unique = [];
    for (var i = userMsgs.length - 1; i >= 0; i--) {
      var key = (userMsgs[i].text || '').trim().toLowerCase().slice(0, 60);
      if (!seen[key]) {
        seen[key] = true;
        unique.unshift(userMsgs[i]);
      }
    }
    unique = unique.slice(-5);

    if (unique.length === 0) {
      if (emptyHint) emptyHint.style.display = '';
      return;
    }
    if (emptyHint) emptyHint.style.display = 'none';

    unique.reverse().forEach(function(item, idx) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'jarvis-recent-session-item' + (idx === 0 ? ' active-session' : '');
      btn.innerHTML = '<span class="jarvis-recent-title">' + escSidebar(truncate(item.text, 42)) + '</span>' +
        '<span class="jarvis-recent-time' + (idx === 0 ? ' is-active' : '') + '">' +
        escSidebar(item.time || '') + '</span>';
      btn.addEventListener('click', function(e) {
        e.preventDefault();
        list.querySelectorAll('.jarvis-recent-session-item').forEach(function(b) {
          b.classList.remove('active-session');
          var badge = b.querySelector('.jarvis-recent-time');
          if (badge) badge.classList.remove('is-active');
        });
        btn.classList.add('active-session');
        var badge = btn.querySelector('.jarvis-recent-time');
        if (badge) badge.classList.add('is-active');
        // If the history API is available use it; otherwise navigate to dashboard
        if (window.jarvisHistoryAPI) {
          window.jarvisHistoryAPI.open();
        } else {
          window.location.href = "{% url 'dashboard' %}";
        }
      });
      list.appendChild(btn);
    });
  }

  // Try to load on page load from localStorage
  function tryPopulateFromStorage() {
    var userKey = getUserKey();
    var storageKey = 'jarvis_ui_history_' + userKey;
    var fallbackKey = 'jarvis_shared_chat_' + userKey;
    var saved = null;
    try {
      saved = localStorage.getItem(storageKey) || localStorage.getItem(fallbackKey);
    } catch(e) {}
    if (saved) {
      try {
        var parsed = JSON.parse(saved);
        if (Array.isArray(parsed)) {
          populateSidebarSessions(parsed);
        }
      } catch(e) {}
    } else {
      var emptyHint = document.getElementById('sidebar-recent-empty');
      if (emptyHint) emptyHint.style.display = '';
    }
  }

  function syncSidebarFromEvent(e) {
    if (e.detail && Array.isArray(e.detail.history)) {
      populateSidebarSessions(e.detail.history);
    } else {
      tryPopulateFromStorage();
    }
  }

  // Initial render from home.html after its IIFE runs
  document.addEventListener('jarvis:historyReady', syncSidebarFromEvent);
  // Keep the sidebar in sync whenever a history entry is added or deleted
  document.addEventListener('jarvis:historyChanged', syncSidebarFromEvent);

  // Initial population from localStorage
  tryPopulateFromStorage();

  // ── History link (opens history drawer or navigates to dashboard) ─────────
  var histLink = document.getElementById('sidebar-history-link');
  if (histLink) {
    histLink.addEventListener('click', function(e) {
      e.preventDefault();
      if (window.jarvisHistoryAPI) {
        window.jarvisHistoryAPI.toggle();
      } else {
        // On another page: open the drawer button if present, else navigate
        var histBtn = document.getElementById('btn-chat-history');
        if (histBtn) {
          histBtn.click();
        } else {
          window.location.href = "{% url 'dashboard' %}?open_history=1";
        }
      }
    });
  }

  // ── Help link ─────────────────────────────────────────────────────────────
  var helpLink = document.getElementById('sidebar-help-link');
  if (helpLink) {
    helpLink.addEventListener('click', function(e) {
      e.preventDefault();
      var input = document.getElementById('jarvis-user-input') || document.getElementById('jarvis-widget-input');
      var send = document.getElementById('jarvis-btn-send') || document.getElementById('jarvis-widget-send');
      if (input && send) {
        input.value = "Help & capabilities";
        send.click();
      }
    });
  }

})();
</script>

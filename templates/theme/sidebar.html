{% load static %}
<aside class="jarvis-sidebar">

  <!-- Brand Header -->
  <a href="{% url 'dashboard' %}" class="jarvis-sidebar-brand">
    <div class="jarvis-brand-icon-box">
      <!-- Crossed wrenches/tools icon in mint green -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
        <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
      </svg>
    </div>
    <div class="jarvis-brand-text">
      <span class="jarvis-brand-title">MotorAssistant</span>
      <span class="jarvis-brand-subtitle">YOUR REPAIR COPILOT</span>
    </div>
  </a>

  <!-- New Diagnosis CTA -->
  <div class="jarvis-sidebar-action-box">
    <button type="button" class="jarvis-new-diagnosis-btn" id="sidebar-btn-new-diagnosis" title="Start new diagnosis">
      <span>New diagnosis</span>
      <i class="fa-solid fa-arrow-right"></i>
    </button>
  </div>

  <!-- Navigation Links -->
  <ul class="jarvis-sidebar-nav">
    <li class="jarvis-nav-item">
      <a href="{% url 'dashboard' %}" class="jarvis-nav-link {% if request.resolver_match.url_name == 'dashboard' or request.resolver_match.url_name == 'home' %}active{% endif %}">
        <div class="jarvis-nav-link-left">
          <span class="jarvis-nav-link-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="15" height="15">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
            </svg>
          </span>
          <span>Diagnostic chat</span>
        </div>
      </a>
    </li>

    <li class="jarvis-nav-item">
      <a href="{% url 'motor:viewer' %}" class="jarvis-nav-link {% if request.resolver_match.app_name == 'motor' and request.resolver_match.url_name == 'viewer' %}active{% endif %}">
        <div class="jarvis-nav-link-left">
          <span class="jarvis-nav-link-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="15" height="15">
              <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
              <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
            </svg>
          </span>
          <span>Repair guides</span>
        </div>
      </a>
    </li>

    <li class="jarvis-nav-item">
      <a href="#" class="jarvis-nav-link" id="sidebar-history-link">
        <div class="jarvis-nav-link-left">
          <span class="jarvis-nav-link-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="15" height="15">
              <circle cx="12" cy="12" r="10"/>
              <polyline points="12 6 12 12 16 14"/>
            </svg>
          </span>
          <span>Session history</span>
        </div>
      </a>
    </li>
  </ul>

  <!-- Recent Sessions Section -->
  <div class="jarvis-sidebar-section jarvis-recent-sessions-header">
    <span>RECENT SESSIONS</span>
  </div>

  <div class="jarvis-recent-sessions-list">
    <button type="button" class="jarvis-recent-session-item active-session" data-session-prompt="Engine won't start: my engine won't start but the dash lights turn on">
      <span class="jarvis-recent-title">Engine won't start</span>
      <span class="jarvis-recent-time is-active">Active diagnosis</span>
    </button>
    <button type="button" class="jarvis-recent-session-item" data-session-prompt="Front brake inspection: lever feels spongy when braking">
      <span class="jarvis-recent-title">Front brake inspection</span>
      <span class="jarvis-recent-time">Yesterday</span>
    </button>
    <button type="button" class="jarvis-recent-session-item" data-session-prompt="Tire pressure check: what should I inspect before a ride?">
      <span class="jarvis-recent-title">Tire pressure check</span>
      <span class="jarvis-recent-time">Oct 19</span>
    </button>
  </div>

  <div class="jarvis-sidebar-spacer"></div>

  <!-- Diagnostic Quota Card (Hidden or minimal) -->
  <div class="jarvis-sidebar-quota-card d-none" id="sidebar-quota-widget">
    <div class="jarvis-sidebar-quota-header">
      <span class="jarvis-sidebar-quota-title">Diagnostic quota</span>
      <span class="jarvis-sidebar-quota-pct" id="sidebar-quota-pct">100%</span>
    </div>
    <div class="jarvis-sidebar-quota-bar">
      <div class="jarvis-sidebar-quota-fill" id="sidebar-quota-bar-fill" style="width: 100%;"></div>
    </div>
    <div class="jarvis-sidebar-quota-sub" id="sidebar-quota-rem">1,500 requests remaining</div>
  </div>

  <!-- Need a mechanic? Box from reference image -->
  <div class="ma-sidebar-mechanic-box">
    <div class="ma-sidebar-mechanic-title">Need a mechanic?</div>
    <div class="ma-sidebar-mechanic-hint">Know when to stop DIY.</div>
  </div>

  <!-- Account settings / Help -->
  <div class="ma-sidebar-footer-links">
    <a href="#" data-bs-toggle="offcanvas" data-bs-target="#offcanvasSettings">Account settings</a>
    <span class="ma-footer-divider">/</span>
    <a href="#" id="sidebar-help-link">Help</a>
  </div>

</aside>

<script>
/* Wire sidebar navigation, new diagnosis, recent sessions, history and help links */
(function() {
  // New Diagnosis Button
  var newDiagBtn = document.getElementById('sidebar-btn-new-diagnosis');
  if (newDiagBtn) {
    newDiagBtn.addEventListener('click', function(e) {
      e.preventDefault();
      var clearBtn = document.getElementById('btn-clear-logs');
      if (clearBtn) {
        clearBtn.click();
      } else {
        window.location.href = "{% url 'dashboard' %}";
      }
    });
  }

  // Recent Sessions clickable items
  document.querySelectorAll('.jarvis-recent-session-item').forEach(function(btn) {
    btn.addEventListener('click', function(e) {
      e.preventDefault();
      document.querySelectorAll('.jarvis-recent-session-item').forEach(function(b) {
        b.classList.remove('active-session');
        var badge = b.querySelector('.jarvis-recent-time');
        if (badge && badge.classList.contains('is-active')) {
          badge.classList.remove('is-active');
        }
      });
      btn.classList.add('active-session');
      var prompt = btn.getAttribute('data-session-prompt') || btn.querySelector('.jarvis-recent-title')?.textContent?.trim();
      var input = document.getElementById('jarvis-user-input') || document.getElementById('jarvis-widget-input');
      var send = document.getElementById('jarvis-btn-send') || document.getElementById('jarvis-widget-send');
      if (input && send && prompt) {
        input.value = prompt;
        send.click();
      }
    });
  });

  // History link
  var histLink = document.getElementById('sidebar-history-link');
  if (histLink) {
    histLink.addEventListener('click', function(e) {
      e.preventDefault();
      var histBtn = document.getElementById('btn-chat-history');
      if (histBtn) histBtn.click();
    });
  }

  // Help link
  var helpLink = document.getElementById('sidebar-help-link');
  if (helpLink) {
    helpLink.addEventListener('click', function(e) {
      e.preventDefault();
      var input = document.getElementById('jarvis-user-input') || document.getElementById('jarvis-widget-input');
      var send = document.getElementById('jarvis-btn-send') || document.getElementById('jarvis-widget-send');
      if (input && send) {
        input.value = "Help & capabilities";
        send.click();
      }
    });
  }
})();
</script>

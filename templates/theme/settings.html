<form
  class="offcanvas offcanvas-start offcanvas-narrow"
  tabindex="-1"
  id="offcanvasSettings"
  aria-labelledby="offcanvasSettingsLabel"
>
  <div class="offcanvas-header">
    <h2 class="offcanvas-title" id="offcanvasSettingsLabel">
      <i class="fa-solid fa-palette text-info me-2"></i>Theme Settings
    </h2>
    <button
      type="button"
      class="btn-close text-reset"
      data-bs-dismiss="offcanvas"
      aria-label="Close"
    ></button>
  </div>
  <div class="offcanvas-body d-flex flex-column">
    <div>
      <!-- Color mode (Dark / Light) -->
      <div class="mb-4">
        <label class="form-label">Color mode</label>
        <p class="form-hint">Choose between Cyber Dark or Clean Light.</p>

        <label class="form-check">
          <div class="form-selectgroup-item">
            <input
              type="radio"
              name="theme"
              value="dark"
              class="form-check-input"
              checked
            />
            <div class="form-check-label"><i class="fa-solid fa-moon me-1 text-info"></i> Dark (J.A.R.V.I.S.)</div>
          </div>
        </label>

        <label class="form-check">
          <div class="form-selectgroup-item">
            <input
              type="radio"
              name="theme"
              value="light"
              class="form-check-input"
            />
            <div class="form-check-label"><i class="fa-solid fa-sun me-1 text-warning"></i> Light</div>
          </div>
        </label>
      </div>

      <!-- Color scheme (Primary accent) -->
      <div class="mb-4">
        <label class="form-label">Accent color</label>
        <p class="form-hint">Select the accent glowing color for waveforms and highlights.</p>

        <div class="row g-2">
          <div class="col-auto">
            <label class="form-colorinput" title="Cyan (Default J.A.R.V.I.S.)">
              <input
                name="theme-primary"
                type="radio"
                value="cyan"
                class="form-colorinput-input"
                checked
              />
              <span class="form-colorinput-color bg-cyan"></span>
            </label>
          </div>

          <div class="col-auto">
            <label class="form-colorinput" title="Teal">
              <input
                name="theme-primary"
                type="radio"
                value="teal"
                class="form-colorinput-input"
              />
              <span class="form-colorinput-color bg-teal"></span>
            </label>
          </div>

          <div class="col-auto">
            <label class="form-colorinput" title="Azure / Sky">
              <input
                name="theme-primary"
                type="radio"
                value="azure"
                class="form-colorinput-input"
              />
              <span class="form-colorinput-color bg-azure"></span>
            </label>
          </div>

          <div class="col-auto">
            <label class="form-colorinput" title="Blue">
              <input
                name="theme-primary"
                type="radio"
                value="blue"
                class="form-colorinput-input"
              />
              <span class="form-colorinput-color bg-blue"></span>
            </label>
          </div>

          <div class="col-auto">
            <label class="form-colorinput" title="Indigo">
              <input
                name="theme-primary"
                type="radio"
                value="indigo"
                class="form-colorinput-input"
              />
              <span class="form-colorinput-color bg-indigo"></span>
            </label>
          </div>

          <div class="col-auto">
            <label class="form-colorinput" title="Purple">
              <input
                name="theme-primary"
                type="radio"
                value="purple"
                class="form-colorinput-input"
              />
              <span class="form-colorinput-color bg-purple"></span>
            </label>
          </div>

          <div class="col-auto">
            <label class="form-colorinput" title="Pink">
              <input
                name="theme-primary"
                type="radio"
                value="pink"
                class="form-colorinput-input"
              />
              <span class="form-colorinput-color bg-pink"></span>
            </label>
          </div>

          <div class="col-auto">
            <label class="form-colorinput" title="Red">
              <input
                name="theme-primary"
                type="radio"
                value="red"
                class="form-colorinput-input"
              />
              <span class="form-colorinput-color bg-red"></span>
            </label>
          </div>

          <div class="col-auto">
            <label class="form-colorinput" title="Orange">
              <input
                name="theme-primary"
                type="radio"
                value="orange"
                class="form-colorinput-input"
              />
              <span class="form-colorinput-color bg-orange"></span>
            </label>
          </div>

          <div class="col-auto">
            <label class="form-colorinput" title="Yellow">
              <input
                name="theme-primary"
                type="radio"
                value="yellow"
                class="form-colorinput-input"
              />
              <span class="form-colorinput-color bg-yellow"></span>
            </label>
          </div>

          <div class="col-auto">
            <label class="form-colorinput" title="Lime">
              <input
                name="theme-primary"
                type="radio"
                value="lime"
                class="form-colorinput-input"
              />
              <span class="form-colorinput-color bg-lime"></span>
            </label>
          </div>

          <div class="col-auto">
            <label class="form-colorinput" title="Green">
              <input
                name="theme-primary"
                type="radio"
                value="green"
                class="form-colorinput-input"
              />
              <span class="form-colorinput-color bg-green"></span>
            </label>
          </div>
        </div>
      </div>

      <!-- Font family -->
      <div class="mb-4">
        <label class="form-label">Font family</label>
        <p class="form-hint">Choose typography style for the interface.</p>

        <div>
          <label class="form-check">
            <div class="form-selectgroup-item">
              <input
                type="radio"
                name="theme-font"
                value="sans-serif"
                class="form-check-input"
                checked
              />
              <div class="form-check-label">Inter / Sans-serif</div>
            </div>
          </label>

          <label class="form-check">
            <div class="form-selectgroup-item">
              <input
                type="radio"
                name="theme-font"
                value="monospace"
                class="form-check-input"
              />
              <div class="form-check-label">Monospace (Terminal)</div>
            </div>
          </label>

          <label class="form-check">
            <div class="form-selectgroup-item">
              <input
                type="radio"
                name="theme-font"
                value="serif"
                class="form-check-input"
              />
              <div class="form-check-label">Serif</div>
            </div>
          </label>

          <label class="form-check">
            <div class="form-selectgroup-item">
              <input
                type="radio"
                name="theme-font"
                value="comic"
                class="form-check-input"
              />
              <div class="form-check-label">Comic</div>
            </div>
          </label>
        </div>
      </div>

      <!-- Dark Base Tone -->
      <div class="mb-4">
        <label class="form-label">Dark background base</label>
        <p class="form-hint">Adjust the deep darkness tone.</p>

        <div>
          <label class="form-check">
            <div class="form-selectgroup-item">
              <input
                type="radio"
                name="theme-base"
                value="gray"
                class="form-check-input"
                checked
              />
              <div class="form-check-label">Cyber Navy (Default)</div>
            </div>
          </label>

          <label class="form-check">
            <div class="form-selectgroup-item">
              <input
                type="radio"
                name="theme-base"
                value="slate"
                class="form-check-input"
              />
              <div class="form-check-label">Deep Slate</div>
            </div>
          </label>

          <label class="form-check">
            <div class="form-selectgroup-item">
              <input
                type="radio"
                name="theme-base"
                value="zinc"
                class="form-check-input"
              />
              <div class="form-check-label">Zinc Black</div>
            </div>
          </label>

          <label class="form-check">
            <div class="form-selectgroup-item">
              <input
                type="radio"
                name="theme-base"
                value="stone"
                class="form-check-input"
              />
              <div class="form-check-label">Warm Stone</div>
            </div>
          </label>
        </div>
      </div>

      <!-- Corner Radius -->
      <div class="mb-4">
        <label class="form-label">Corner Radius</label>
        <p class="form-hint">Card and chip edge curvature.</p>

        <div class="d-flex gap-2">
          <label class="form-check">
            <div class="form-selectgroup-item">
              <input type="radio" name="theme-radius" value="0" class="form-check-input" />
              <div class="form-check-label px-2">Sharp (0)</div>
            </div>
          </label>

          <label class="form-check">
            <div class="form-selectgroup-item">
              <input type="radio" name="theme-radius" value="0.5" class="form-check-input" />
              <div class="form-check-label px-2">Small (0.5)</div>
            </div>
          </label>

          <label class="form-check">
            <div class="form-selectgroup-item">
              <input type="radio" name="theme-radius" value="1" class="form-check-input" checked />
              <div class="form-check-label px-2">Default (1)</div>
            </div>
          </label>

          <label class="form-check">
            <div class="form-selectgroup-item">
              <input type="radio" name="theme-radius" value="1.5" class="form-check-input" />
              <div class="form-check-label px-2">Round (1.5)</div>
            </div>
          </label>
        </div>
      </div>
    </div>

    <div class="mt-auto pt-3 border-top d-flex gap-2">
      <button type="button" class="btn btn-ghost-danger w-50" id="reset-changes">
        <i class="fa-solid fa-rotate-left me-1"></i>Reset
      </button>
      <button type="button" class="btn btn-info w-50" data-bs-dismiss="offcanvas">
        Done
      </button>
    </div>
  </div>
</form>

<script>
  (function () {
    const themeConfig = {
      theme: "dark",
      "theme-base": "gray",
      "theme-font": "sans-serif",
      "theme-primary": "cyan",
      "theme-radius": "1",
    };

    const form = document.getElementById("offcanvasSettings");
    const resetButton = document.getElementById("reset-changes");

    function applyConfig(key, value) {
      document.documentElement.setAttribute("data-bs-" + key, value);
      try {
        localStorage.setItem("tabler-" + key, value);
      } catch (e) {}
    }

    function syncRadios() {
      for (const key in themeConfig) {
        let value = themeConfig[key];
        try {
          value = localStorage.getItem("tabler-" + key) || themeConfig[key];
        } catch (e) {}

        const radios = form.querySelectorAll(`[name="${key}"]`);
        radios.forEach((radio) => {
          radio.checked = (radio.value === value);
        });
        document.documentElement.setAttribute("data-bs-" + key, value);
      }
    }

    form.addEventListener("change", function (event) {
      const target = event.target;
      if (target && target.name) {
        applyConfig(target.name, target.value);
      }
    });

    if (resetButton) {
      resetButton.addEventListener("click", function () {
        for (const key in themeConfig) {
          try {
            localStorage.removeItem("tabler-" + key);
          } catch (e) {}
        }
        syncRadios();
      });
    }

    syncRadios();
  })();
</script>

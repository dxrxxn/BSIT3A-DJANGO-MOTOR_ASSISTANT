{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
    <meta http-equiv="X-UA-Compatible" content="ie=edge"/>
    <title>MotorAssistant</title>
    <link rel="icon" href="./favicon-dev.ico" type="image/x-icon"/>
    <link rel="shortcut icon" href="./favicon-dev.ico" type="image/x-icon"/>
    
    <!-- Tabler Core for utilities / components -->
    <link href="{% static 'css/tabler.css' %}" rel="stylesheet"/>
    <!-- FontAwesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
    <!-- J.A.R.V.I.S. Theme -->
    <link href="{% static 'css/jarvis-theme.css' %}?v={% now 'U' %}" rel="stylesheet"/>
    <link href="{% static 'css/motor-assistant-theme.css' %}?v={% now 'U' %}" rel="stylesheet"/>
    {% block extra_css %}{% endblock %}
    <style>
      @import url("https://rsms.me/inter/inter.css");
    </style>
    <script src="{% static 'js/tabler-theme.js' %}"></script>
  </head>

  <body>
    <div class="jarvis-window-shell">
      <!-- App Body (Sidebar + Content Workspace) -->
      <div class="jarvis-app-body">
        {% include 'theme/sidebar.html' %}

        <div class="jarvis-workspace">
          {% block content %}
          {% endblock %}
        </div>
      </div>
    </div>

    <!-- Theme Settings Offcanvas Drawer & Floating Button -->
    {% include 'theme/settings.html' %}

    <!-- Scripts: Tabler Core provides full local Bootstrap 5 components -->
    <script src="{% static 'js/tabler.js' %}"></script>
    <script>
      // Ensure window.bootstrap is exposed from local tabler bundle
      if (typeof window.bootstrap === 'undefined' && window.tabler) {
        window.bootstrap = window.tabler.bootstrap || window.tabler;
      }
      // Resilient offcanvas handler for slow connections & mobile browsers
      document.addEventListener('click', function(e) {
        var toggle = e.target.closest('[data-bs-toggle="offcanvas"]');
        if (toggle) {
          var targetId = toggle.getAttribute('data-bs-target') || toggle.getAttribute('href');
          if (targetId && targetId.startsWith('#')) {
            var drawer = document.querySelector(targetId);
            if (drawer) {
              e.preventDefault();
              if (window.bootstrap && window.bootstrap.Offcanvas) {
                var instance = window.bootstrap.Offcanvas.getOrCreateInstance(drawer);
                instance.toggle();
              } else {
                drawer.classList.toggle('show');
                drawer.style.visibility = drawer.classList.contains('show') ? 'visible' : 'hidden';
              }
            }
          }
        }
        var dismiss = e.target.closest('[data-bs-dismiss="offcanvas"]');
        if (dismiss) {
          var drawer = dismiss.closest('.offcanvas');
          if (drawer) {
            e.preventDefault();
            if (window.bootstrap && window.bootstrap.Offcanvas) {
              var instance = window.bootstrap.Offcanvas.getInstance(drawer);
              if (instance) instance.hide();
              else drawer.classList.remove('show');
            } else {
              drawer.classList.remove('show');
              drawer.style.visibility = 'hidden';
            }
          }
        }
      });
    </script>
    {% block extra_js %}{% endblock %}
  </body>
</html>

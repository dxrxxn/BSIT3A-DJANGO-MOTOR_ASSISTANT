<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="520" height="260" rx="12" fill="url(#bg)" stroke="#334155" stroke-width="1.5"/>

  <!-- Top Header Badge -->
  <rect x="16" y="14" width="220" height="28" rx="6" fill="#0f172a" stroke="#0ea5e9" stroke-width="1" opacity="0.9"/>
  <circle cx="28" cy="28" r="4" fill="#10b981"/>
  <text x="38" y="32" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="0.5">VISUAL REFERENCE</text>

  <!-- Part Title -->
  <text x="16" y="62" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="700">Spark Plug & Ignition</text>

  <!-- Left: Component Vector Drawing -->
  <g transform="translate(16, 75)">
    <rect width="230" height="135" rx="8" fill="#111827" stroke="#1e293b" stroke-width="1"/>
    
    <!-- Terminal Nut -->
    <rect x="105" y="15" width="20" height="12" rx="2" fill="#cbd5e1"/>
    <!-- Ceramic Ribs -->
    <rect x="100" y="27" width="30" height="30" rx="4" fill="#f8fafc" stroke="#94a3b8"/>
    <line x1="98" y1="35" x2="132" y2="35" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="98" y1="45" x2="132" y2="45" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Metal Hex Nut -->
    <path d="M 92 57 L 138 57 L 132 75 L 98 75 Z" fill="#64748b" stroke="#475569"/>
    <!-- Threaded Body -->
    <rect x="100" y="75" width="30" height="30" fill="#475569"/>
    <line x1="97" y1="81" x2="133" y2="81" stroke="#334155" stroke-width="1.5"/>
    <line x1="97" y1="87" x2="133" y2="87" stroke="#334155" stroke-width="1.5"/>
    <line x1="97" y1="93" x2="133" y2="93" stroke="#334155" stroke-width="1.5"/>
    <line x1="97" y1="99" x2="133" y2="99" stroke="#334155" stroke-width="1.5"/>
    <!-- Electrode Gap -->
    <rect x="112" y="105" width="6" height="8" fill="#f59e0b"/>
    <path d="M 104 116 L 115 116" stroke="#94a3b8" stroke-width="2"/>
    <text x="115" y="128" fill="#38bdf8" font-family="sans-serif" font-size="9" font-weight="700" text-anchor="middle">GAP: 0.6 - 0.9 mm</text>

  </g>

  <!-- Right: Motorcycle Chassis Locator -->
  <g transform="translate(260, 20)">
    <rect width="244" height="190" rx="8" fill="#090d16" stroke="#1e293b" stroke-width="1"/>
    <!-- Locator Title -->
    <text x="12" y="22" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="600">MOTORCYCLE LOCATION</text>
    
    <!-- Motorcycle Silhouette (Scooter/Underbone Outline) -->
    <g transform="translate(18, 38)" stroke="#475569" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- Front Wheel -->
      <circle cx="35" cy="85" r="24" stroke="#64748b" stroke-width="3"/>
      <circle cx="35" cy="85" r="8" fill="#334155"/>
      <!-- Rear Wheel -->
      <circle cx="175" cy="85" r="24" stroke="#64748b" stroke-width="3"/>
      <circle cx="175" cy="85" r="8" fill="#334155"/>
      <!-- Front Fork & Handlebar -->
      <path d="M 35 85 L 55 25 L 50 15 L 68 15" />
      <!-- Frame Spine -->
      <path d="M 55 35 L 75 60 L 110 60 L 140 45 L 175 48 L 180 65" />
      <!-- Seat Contour -->
      <path d="M 95 44 C 115 42, 140 40, 160 46" stroke="#0ea5e9" stroke-width="2.5"/>
      <!-- Lower Chassis / Engine Mount -->
      <path d="M 75 60 L 85 85 L 145 85 L 175 85" stroke="#334155"/>
      <!-- Swingarm -->
      <line x1="125" y1="80" x2="175" y2="85" stroke="#475569" stroke-width="2.5"/>
    </g>

    <!-- Glowing Location Hotspot Dot -->
    <circle cx="115" cy="105" r="14" fill="#06b6d4" opacity="0.25">
      <animate attributeName="r" values="8;16;8" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="115" cy="105" r="6" fill="#06b6d4" stroke="#ffffff" stroke-width="2"/>
    <rect x="70" y="77" width="95" height="18" rx="4" fill="#0284c7" filter="url(#shadow)"/>
    <text x="117" y="90" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="9" font-weight="700" text-anchor="middle">CYLINDER HEAD</text>
  </g>

  <!-- Bottom Location Banner -->
  <rect x="16" y="220" width="488" height="28" rx="6" fill="#0369a1" fill-opacity="0.15" stroke="#0284c7" stroke-width="1"/>
  <text x="28" y="238" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700">📍 LOOK HERE:</text>
  <text x="110" y="238" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="500">Center or top of engine cylinder head under the spark plug rubber boot</text>
</svg>